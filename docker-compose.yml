version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: coovi_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: coovi
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    # Port NOT published to the host — API reaches Mongo over the internal network only.

  coovi-api:
    build:
      context: ./coovi-api
      dockerfile: Dockerfile
    container_name: coovi_api
    restart: unless-stopped
    env_file: ./coovi-api/.env.production
    depends_on:
      - mongodb
    networks:
      - internal
      - web
    expose:
      - "5000"

  coovi-storefront:
    build:
      context: ./coovi-storefront
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD: "true"
    container_name: coovi_storefront
    restart: unless-stopped
    env_file: ./coovi-storefront/.env.production
    depends_on:
      - coovi-api
    networks:
      - web
    expose:
      - "3000"

  coovi-admin:
    build:
      context: ./coovi-admin
      dockerfile: Dockerfile
    container_name: coovi_admin
    restart: unless-stopped
    networks:
      - web
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: coovi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - coovi-api
      - coovi-storefront
      - coovi-admin
    networks:
      - web

networks:
  web:
  internal:

volumes:
  mongo_data:
  certbot_www:
  certbot_certs:

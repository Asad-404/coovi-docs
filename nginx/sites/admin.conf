# HTTP → HTTPS redirect + Let's Encrypt challenge
server {
  listen 80;
  server_name admin.coovi.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  http2 on;
  server_name admin.coovi.com;

  ssl_certificate     /etc/letsencrypt/live/admin.coovi.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.coovi.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass         http://coovi_admin:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }
}

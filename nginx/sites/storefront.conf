# HTTP → HTTPS redirect + Let's Encrypt challenge
server {
  listen 80;
  server_name coovi.com www.coovi.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# www → apex redirect
server {
  listen 443 ssl;
  http2 on;
  server_name www.coovi.com;

  ssl_certificate     /etc/letsencrypt/live/coovi.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/coovi.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  return 301 https://coovi.com$request_uri;
}

# HTTPS apex
server {
  listen 443 ssl;
  http2 on;
  server_name coovi.com;

  ssl_certificate     /etc/letsencrypt/live/coovi.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/coovi.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  location / {
    proxy_pass         http://coovi_storefront:3000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection 'upgrade';
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }
}
